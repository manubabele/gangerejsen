ERYWHERE."],["stella","Andromedog barked at it.","The bright thing stopped.","Then it went...",'"BONK."'],["stella","Very suspicious.",'Comets do not usually go "BONK."',"Your dog chased it toward the ice planet."],["stella","Take my golden visor.","Stars don't need sunglasses.","We ARE the sunglasses problem."]],"6_1":[["zog","Temperature: minus six.","Pingo says it is summer.","He is wearing swimming trunks.","Under his feathers."],["zog","I asked why.",'He said, "Fashion."',"I stopped asking questions."]],"6_6":[["pingo","Andromedog saved me!","I was stuck under the snow.","He dug me out.","Then he licked my face."],["pingo","His tongue froze to my beak.","We stayed like that for an hour.","It was...","very personal."],["pingo","Then that glowing ball flew past.","Andromedog ripped his tongue free and chased it.","Take my cape.","Much too warm for summer."]],"7_1":[["zog","Meet Otto.","Otto has seven arms.","He used to have eight.","The eighth went shopping.","Three years ago.","Nobody knows what happened."]],"7_6":[["otto","Andromedog borrowed my lamp.","He pointed it into the fog.","Then he shouted:",'"WOOF!"'],["otto","The fog moved.","He shouted again.","The fog apologised.","Very polite fog."],["otto","Then we saw it.","A HUGE glowing ball.","It flew toward the jungle.","Andromedog followed it."],["otto","Take the lamp.","Seven arms.","I can hold plenty of other things."]],"8_1":[["zog","Grib is hiding.","He is scared of spiders.","He says eight legs is ridiculous.","He has formally complained.","The spiders have not replied."]],"8_6":[["grib","I MET YOUR DOG.","He told me everything."],["astro","You speak dog?"],["grib","Of course.","I know three words.",'"Woof."','"WOOF."',"And...",'"Woooooof."',"Completely different meanings."],["grib","Your dog said the glowing ball belongs to...","THE RING KING.","He went after it.","I'm coming with you.","I call the window seat."]],"9_1":[["zog","That is Lava.","She has one enormous egg.","She hopes a baby lizard is in
